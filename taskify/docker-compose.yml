# Will grow to 3 services (db, server, client) — starting with db only.
services:
  db:
    image: postgres:16-alpine
    command: postgres -c log_statement=all
    environment:
      POSTGRES_USER: taskify
      POSTGRES_PASSWORD: taskify
      POSTGRES_DB: taskify
    ports:
      - "5432:5432" # handy for local psql/GUI tools; can remove later
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./server/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskify -d taskify"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
